# sample hyprlock.conf
# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
#
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
#
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
#
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf
#

$font = Rubik

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
}

animations {
    enabled = true
    bezier = enter, 0.22, 1, 0.36, 1
    bezier = exit, 0.4, 0, 1, 1
    animation = fadeIn, 1, 3, enter
    animation = fadeOut, 1, 2, exit
    animation = inputFieldDots, 1, 2, enter
}

background {
    monitor =
    path = screenshot
    color = #11111b
    blur_size = 8
    blur_passes = 3
    brightness = 0.42
    contrast = 0.94
    vibrancy = 0.08
    vibrancy_darkness = 0.2
}

label {
    monitor =
    text = $TIME
    color = #cdd6f4
    font_family = $font
    font_size = 124
    position = 0, 210
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = #a6adc8
    font_family = $font
    font_size = 25
    position = 0, 108
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = #cba6f7
    font_family = $font
    font_size = 18
    position = 0, -40
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 413, 65
    outline_thickness = 3
    dots_size = 0.23
    dots_spacing = 0.28
    dots_center = true
    outer_color = #cba6f7
    inner_color = #313244
    font_color = #cdd6f4
    check_color = #a6e3a1
    fail_color = #f38ba8
    capslock_color = #f9e2af
    font_family = $font
    font_size = 18
    placeholder_text = Password
    check_text = Open sesame
    fail_text = $FAIL
    fade_on_empty = false
    rounding = 32
    position = 0, -110
    halign = center
    valign = center
}
